<main class="login">
  <div class="login__card">
    <div class="login__brand"><div class="brand__logo"><svg class="icon "><use href="#i-plus"/></svg></div>
      <div><b>Emergency Hub</b><small>Admin Console</small></div></div>
    <form id="loginForm" novalidate>
      <label class="fld"><span>Username</span><input class="input" id="u" autocomplete="username" required></label>
      <label class="fld"><span>Password</span><input class="input" id="p" type="password" autocomplete="current-password" required></label>
      <p class="form-error" id="err" hidden></p>
      <button class="btn btn--primary" id="go" type="submit">Sign in</button>
    </form>
    <p class="login__hint">First time? The admin password is printed in the terminal when the server first starts.
      Forgot it? Run <code>node server.js --reset-admin</code> in the <code>server</code> folder.</p>
  </div>
</main>
<script src="app.js"></script>
<script src="pages/login.js"></script>
</body>
</html>
